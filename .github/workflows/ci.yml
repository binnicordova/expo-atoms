name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint --max-warnings 0
      - run: bun run test --ci
        env:
          CI: 1
      - run: bun run prepare
      - run: npm pack --dry-run
