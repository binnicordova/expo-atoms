name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [19, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # React 19 is the primary, pinned lane (typecheck/lint/build/pack run
      # here only). The React 18 lane exists solely to exercise the
      # hand-rolled `use()` polyfill in src/react/useAtomValue.ts, which the
      # primary lane's React 19 never touches. Expo SDK 52 is the last SDK on
      # React 18; @testing-library/react-native@14 (the primary pin) requires
      # React >=19, so this lane pins its own compatible major instead.
      - name: Use React 18 / Expo SDK 52 for this lane
        if: matrix.react == 18
        run: |
          bun add --dev --no-save \
            react@18.3.1 react-dom@18.3.1 react-native@0.76.9 react-test-renderer@18.3.1 \
            expo@52.0.49 jest-expo@52.0.6 babel-preset-expo@~12.0.12 \
            @testing-library/react-native@12.9.0 @types/react@18.3.29
      - run: bun run typecheck
        if: matrix.react == 19
      - run: bun run lint --max-warnings 0
        if: matrix.react == 19
      - run: bun run test --ci
        env:
          CI: 1
      - run: bun run prepare
        if: matrix.react == 19
      - run: bun run verify-build
        if: matrix.react == 19
      - run: npm pack --dry-run
        if: matrix.react == 19
